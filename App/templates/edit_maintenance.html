{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>Edit Maintenance - {{ maintenance.description }}</h1>

    {% if msg %}
        <div class="alert alert-info mt-2">{{ msg }}</div>
    {% endif %}

    <form method="POST" class="mt-3">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Save Changes" class="btn btn-success">
        <a href="{% url 'maintenance_list_page' %}" class="btn btn-secondary">Back to List</a>
    </form>
{% endblock content %}

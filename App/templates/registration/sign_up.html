{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Sign Up - Rental Management</title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
    <link rel="icon" href="{% static 'assets/img/kaiadmin/favicon.ico' %}" type="image/x-icon" />

    <!-- Fonts and icons -->
    <script src="{% static 'assets/js/plugin/webfont/webfont.min.js' %}"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["{% static 'assets/css/fonts.min.css' %}"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/plugins.min.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/kaiadmin.min.css' %}" />
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            margin: 0;
        }
        .signup-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e3e6ed;
            overflow: hidden;
        }
        .signup-header {
            background: #1a2035;
            color: #ffffff;
            padding: 30px 25px;
            text-align: center;
        }
        .signup-body {
            padding: 35px 30px;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <h2 class="fw-bold mb-1"><i class="fas fa-home me-2"></i> Rental Mgt</h2>
            <p class="text-white-50 mb-0 small">Create a new account</p>
        </div>
        <div class="signup-body">
            <h3 class="fw-bold text-dark mb-4 text-center">Register</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-4">
                    <input type="submit" value="Create Account" class="btn btn-success btn-block w-100 py-2 fw-bold">
                </div>
            </form>
            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Already have an account? <a href="{% url 'login' %}" class="fw-bold text-primary">Log in here</a>
            </p>
        </div>
    </div>
</body>
</html>
